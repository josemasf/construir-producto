name: Validate Slidev deck

on:
  pull_request:
    paths:
      - "slides.md"
      - "style.css"
      - "global-bottom.vue"
      - "components/**"
      - "scripts/**"
      - "public/images/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/slides.yml"
  push:
    branches:
      - main
    paths:
      - "slides.md"
      - "style.css"
      - "global-bottom.vue"
      - "components/**"
      - "scripts/**"
      - "public/images/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/slides.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build presentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-deck.mjs
      - run: pnpm build
